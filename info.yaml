# Tiny Tapeout project information
project:
  title: "Supervisor CNC V4"
  author: "Pizano"
  discord: ""
  description: "Supervisa los pulsos STEP de los ejes X e Y y retiene la falla si un eje vigilado pasa aproximadamente 2 segundos sin pulsos."
  language: "Verilog"
  clock_hz: 10000000

  tiles: "1x1"

  top_module: "tt_um_supervisor_cnc_v4"

  source_files:
    - "project.v"

pinout:
  # Entradas
  ui[0]: "step_x"
  ui[1]: "step_y"
  ui[2]: "vigilar_x"
  ui[3]: "vigilar_y"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Salidas
  uo[0]: "falla_x"
  uo[1]: "falla_y"
  uo[2]: "falla_general"
  uo[3]: "salida_segura"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Pines bidireccionales
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
